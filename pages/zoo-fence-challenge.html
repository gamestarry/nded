<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Zoo Fence Challenge | NDED Preview</title>
  <style>
    :root{--ink:#24364b;--muted:#6f8092;--blue:#4f78e8;--blue-dark:#365fcf;--blue-soft:#edf3ff;--green:#52b788;--green-dark:#2f8f68;--grass:#dff3cf;--cream:#fffaf0;--danger:#d86464;--shadow:0 16px 40px rgba(45,70,100,.10)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f4f8fd,#eef7ef);color:var(--ink);font-family:Inter,ui-rounded,"Segoe UI",system-ui,sans-serif;padding:20px 12px 44px}button,input{font:inherit}.page{width:min(1160px,100%);margin:auto}.brand{display:flex;justify-content:center;gap:10px;align-items:center;margin-bottom:14px;font-weight:800;color:#34506b}.brand b{background:#fff;border:1px solid #dbe6f2;border-radius:12px;padding:6px 10px}.brand span{font-size:.78rem;padding:4px 9px;border-radius:999px;background:#fff3ca;color:#84651d;border:1px solid #f0d887}
    .shell{background:rgba(255,255,255,.94);border:1px solid #d8e4ee;border-radius:28px;box-shadow:var(--shadow);overflow:hidden}.hero{padding:26px 20px 18px;text-align:center;background:linear-gradient(135deg,#f7fbff,#f4fff4);border-bottom:1px solid #e6edf5}.hero h1{margin:0;font-size:clamp(2rem,5vw,3rem);letter-spacing:-.035em}.hero p{margin:8px 0 0;color:var(--muted)}.progress{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}.count{font-weight:900;color:var(--blue-dark);background:var(--blue-soft);border:1px solid #cad8ff;padding:7px 13px;border-radius:999px}.animals{display:flex;gap:7px}.step{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#fff;border:2px solid #dfe8f0;font-size:1.2rem;opacity:.35;position:relative}.step.current{opacity:1;border-color:#9eb8ff;box-shadow:0 0 0 4px rgba(79,120,232,.1)}.step.done{opacity:1;border-color:#8bd2ad;background:#effaf4}.step.done:after{content:"✓";position:absolute;right:-3px;top:-5px;width:17px;height:17px;display:grid;place-items:center;border-radius:50%;background:var(--green-dark);color:#fff;font-size:.68rem;font-weight:900;border:2px solid #fff}
    .body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(290px,.75fr);gap:24px;padding:24px;align-items:start}.card{background:#fff;border:1px solid #e1e9f0;border-radius:22px;box-shadow:0 10px 28px rgba(45,70,100,.06)}.board{padding:20px}.mission{padding:22px;position:sticky;top:14px}.board-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.board-title{font-weight:900}.unit-note{color:var(--muted);font-size:.82rem;text-align:right}
    .grid-wrap{width:min(100%,600px);margin:auto;position:relative;padding:18px 18px 30px 42px}.grid{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;background:#eff8e9;border:3px solid #93b77e;border-radius:16px;overflow:hidden;touch-action:manipulation;user-select:none}.cell{position:relative;border-right:1px solid rgba(105,150,91,.25);border-bottom:1px solid rgba(105,150,91,.25);background:linear-gradient(135deg,var(--grass),#eaf7df);cursor:pointer}.cell:nth-child(8n){border-right:0}.cell:nth-last-child(-n+8){border-bottom:0}.cell.build:hover{background:#d3efc4}.cell.first:after{content:"";position:absolute;inset:22%;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(79,120,232,.18)}.cell.selected{background:linear-gradient(135deg,#ccebb9,#e2f5d7)}.cell.top{box-shadow:inset 0 5px 0 #9c7047}.cell.right{border-right:5px solid #9c7047!important}.cell.bottom{border-bottom:5px solid #9c7047!important}.cell.left{border-left:5px solid #9c7047}.cell.good{background:linear-gradient(135deg,#bce9c7,#e1f7e7)}.animal-here{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(1.2rem,3vw,2.15rem);pointer-events:none;animation:pop .3s ease-out}@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
    .dim-x,.dim-y{position:absolute;display:none;color:#49653c;font-weight:900;font-size:.8rem;background:#fffef8;border:1px solid #d9e6ce;border-radius:999px;padding:3px 9px;white-space:nowrap}.dim-x.show,.dim-y.show{display:block}.dim-x{bottom:0;left:50%;transform:translateX(-50%)}.dim-y{left:0;top:50%;transform:translateY(-50%) rotate(-90deg)}.build-help{text-align:center;color:var(--muted);font-size:.9rem;min-height:1.4em;margin-top:12px}.clear{display:none;margin:10px auto 0;border:1px solid #cfdae5;background:#fff;color:#567085;border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer}.clear.show{display:block}
    .emoji{font-size:2.4rem}.label{margin-top:8px;color:var(--blue-dark);text-transform:uppercase;font-size:.74rem;letter-spacing:.09em;font-weight:900}.mission h2{margin:4px 0 8px;font-size:1.6rem}.mission-text{color:#536a7e;line-height:1.5;margin-bottom:16px}.target{background:var(--cream);border:1px solid #efdfbb;border-radius:15px;padding:13px 15px;margin-bottom:16px;font-weight:800;color:#5f553e;line-height:1.5}.target-row{display:flex;justify-content:space-between;gap:12px;padding:2px 0}.target-row strong{color:#3d4f5f}.answers{display:grid;gap:10px}.field label{display:block;font-size:.84rem;font-weight:900;color:#52677a;margin-bottom:5px}.input-row{display:flex;align-items:center;gap:8px}.input{width:100%;border:2px solid #cad8e6;border-radius:13px;padding:10px 12px;text-align:center;font-size:1.12rem;font-weight:900;color:var(--ink);outline:none;background:#fbfdff}.input:focus{border-color:#7397ef;box-shadow:0 0 0 4px rgba(79,120,232,.1)}.unit{min-width:35px;color:#667c90;font-weight:900}.check{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,var(--blue),#6790f5);color:#fff;font-weight:900;padding:12px 15px;margin-top:13px;cursor:pointer;box-shadow:0 8px 18px rgba(79,120,232,.2)}.check:disabled{opacity:.55;cursor:not-allowed}.feedback{min-height:52px;margin-top:13px;border-radius:13px;padding:10px 12px;display:flex;align-items:center;line-height:1.4;font-weight:750;visibility:hidden}.feedback.show{visibility:visible}.feedback.success{background:#eaf9f1;color:#287154;border:1px solid #bce6cf}.feedback.error{background:#fff1f1;color:#965050;border:1px solid #f0c9c9}
    .finish{display:none;padding:46px 24px 52px;text-align:center}.finish.show{display:block}.finish h2{font-size:clamp(2.2rem,5vw,3.3rem);margin:10px 0 8px}.finish .zoo{font-size:clamp(2rem,6vw,3.4rem);margin:12px 0 16px}.finish p{color:var(--muted)}.again{border:0;border-radius:14px;background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;font-weight:900;padding:12px 22px;cursor:pointer;margin-top:16px}
    @media(max-width:840px){.body{grid-template-columns:1fr}.mission{position:static;order:-1}}@media(max-width:560px){body{padding:9px 7px 28px}.hero{padding:20px 12px 16px}.body{padding:11px;gap:12px}.board{padding:11px}.mission{padding:17px}.grid-wrap{padding:14px 10px 28px 34px}.step{width:33px;height:33px;font-size:1.05rem}.unit-note{font-size:.74rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<main class="page">
  <div class="brand"><b>NDED</b><span>Branch prototype</span></div>
  <section class="shell" aria-labelledby="gameTitle">
    <div id="gameView">
      <header class="hero">
        <h1 id="gameTitle">Zoo Fence Challenge</h1>
        <p>Build animal enclosures with area and perimeter.</p>
        <div class="progress"><div class="count" id="count">1 / 6</div><div class="animals" id="animals"></div></div>
      </header>
      <div class="body">
        <section class="card board">
          <div class="board-head"><div class="board-title">Zoo grass grid</div><div class="unit-note">Each square is 1 m × 1 m</div></div>
          <div class="grid-wrap"><div class="dim-x" id="dimX"></div><div class="dim-y" id="dimY"></div><div class="grid" id="grid" role="grid" aria-label="8 by 8 zoo grid"></div></div>
          <div class="build-help" id="buildHelp"></div><button class="clear" id="clearBtn" type="button">Clear</button>
        </section>
        <aside class="card mission">
          <div class="emoji" id="emoji">🐰</div><div class="label" id="levelLabel">Level 1</div><h2 id="title">Rabbit Habitat</h2>
          <div class="mission-text" id="text"></div><div class="target" id="target"></div><div class="answers" id="answers"></div>
          <button class="check" id="checkBtn" type="button">Check My Answer</button><div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        </aside>
      </div>
    </div>
    <section class="finish" id="finish"><div style="font-size:3rem">🎉</div><h2>Zoo Complete!</h2><div class="zoo">🐰 🐧 🦁 🦒 🐘 🐼</div><p>You built 6 animal habitats using area and perimeter.</p><button class="again" id="again" type="button">Play Again</button></section>
  </section>
</main>
<script>
(function(){
  "use strict";
  var SIZE=8;
  var levels=[
    {animal:"🐰",title:"Rabbit Habitat",mode:"answer-area",w:4,h:3,text:"The rabbit already has a rectangular habitat. Find the space inside it.",prompt:"What is the area?",success:"Great! The rabbit has 12 m² of space."},
    {animal:"🐧",title:"Penguin Habitat",mode:"answer-perimeter",w:5,h:3,text:"The penguin habitat is built. Find how much fencing goes around it.",prompt:"What is the perimeter?",success:"Perfect! The penguin enclosure uses 16 m of fencing."},
    {animal:"🦁",title:"Lion Habitat",mode:"answer-both",w:6,h:4,text:"This lion habitat needs two measurements. Find the space inside and the fence around it.",prompt:"Find both measurements.",success:"Nice work! You found both the area and the perimeter."},
    {animal:"🦒",title:"Giraffe Habitat",mode:"build-area",targetA:18,text:"Now you are the designer. Build a rectangular habitat with exactly 18 m² of space.",success:"Great design! The giraffe has exactly 18 m² of space."},
    {animal:"🐘",title:"Elephant Habitat",mode:"build-both",targetA:20,targetP:18,text:"The elephant needs the right amount of space and the right amount of fencing.",success:"Perfect! The elephant habitat meets both targets."},
    {animal:"🐼",title:"Panda Challenge",mode:"build-less",targetA:12,refP:16,text:"A 2 m × 6 m habitat has an area of 12 m² and uses 16 m of fence. Can you keep the same area and use less fence?",success:"Same area, less fence! Shapes can have the same area but different perimeters."}
  ];
  var $=function(id){return document.getElementById(id)};
  var e={game:$("gameView"),finish:$("finish"),count:$("count"),animals:$("animals"),grid:$("grid"),dimX:$("dimX"),dimY:$("dimY"),buildHelp:$("buildHelp"),clear:$("clearBtn"),emoji:$("emoji"),levelLabel:$("levelLabel"),title:$("title"),text:$("text"),target:$("target"),answers:$("answers"),check:$("checkBtn"),feedback:$("feedback"),again:$("again")};
  var s={i:0,done:{},first:null,rect:null,locked:false};
  function area(w,h){return w*h} function per(w,h){return 2*(w+h)} function buildMode(l){return l.mode.indexOf("build-")===0}
  function norm(a,b){var left=Math.min(a.c,b.c),right=Math.max(a.c,b.c),top=Math.min(a.r,b.r),bottom=Math.max(a.r,b.r);return{left:left,right:right,top:top,bottom:bottom,w:right-left+1,h:bottom-top+1}}
  function feedback(msg,type){e.feedback.className="feedback show "+type;e.feedback.textContent=msg} function clearFeedback(){e.feedback.className="feedback";e.feedback.textContent=""}
  function progress(){e.count.textContent=(s.i+1)+" / "+levels.length;e.animals.innerHTML="";levels.forEach(function(l,n){var d=document.createElement("div");d.className="step";d.textContent=l.animal;if(s.done[n])d.classList.add("done");else if(n===s.i)d.classList.add("current");e.animals.appendChild(d)})}
  function fixed(l){var left=Math.floor((SIZE-l.w)/2),top=Math.floor((SIZE-l.h)/2);return{left:left,right:left+l.w-1,top:top,bottom:top+l.h-1,w:l.w,h:l.h}}
  function renderGrid(){var l=levels[s.i],isBuild=buildMode(l),r=isBuild?s.rect:fixed(l);e.grid.innerHTML="";for(var row=0;row<SIZE;row++){for(var col=0;col<SIZE;col++){var c=document.createElement("div");c.className="cell";c.setAttribute("role","gridcell");if(isBuild&&!s.locked)c.classList.add("build");if(s.first&&!r&&s.first.r===row&&s.first.c===col)c.classList.add("first");if(r&&row>=r.top&&row<=r.bottom&&col>=r.left&&col<=r.right){c.classList.add("selected");if(s.locked)c.classList.add("good");if(row===r.top)c.classList.add("top");if(row===r.bottom)c.classList.add("bottom");if(col===r.left)c.classList.add("left");if(col===r.right)c.classList.add("right")}if(s.locked&&r&&row===Math.floor((r.top+r.bottom)/2)&&col===Math.floor((r.left+r.right)/2)){var a=document.createElement("span");a.className="animal-here";a.textContent=l.animal;c.appendChild(a)}if(isBuild)(function(rr,cc){c.addEventListener("click",function(){gridClick(rr,cc)})})(row,col);e.grid.appendChild(c)}}dims(r)}
  function dims(r){if(!r){e.dimX.classList.remove("show");e.dimY.classList.remove("show");return}e.dimX.textContent="Width "+r.w+" m";e.dimY.textContent="Height "+r.h+" m";e.dimX.classList.add("show");e.dimY.classList.add("show")}
  function gridClick(r,c){if(s.locked)return;clearFeedback();if(!s.first||s.rect){s.first={r:r,c:c};s.rect=null;e.buildHelp.textContent="Now click the opposite corner."}else{s.rect=norm(s.first,{r:r,c:c});e.buildHelp.textContent="Your rectangle is "+s.rect.w+" m × "+s.rect.h+" m."}renderGrid()}
  function input(id,label,unit){var d=document.createElement("div");d.className="field";d.innerHTML='<label for="'+id+'">'+label+'</label><div class="input-row"><input class="input" id="'+id+'" inputmode="numeric" autocomplete="off"><span class="unit">'+unit+"</span></div>";var x=d.querySelector("input");x.addEventListener("input",function(){x.value=x.value.replace(/[^0-9]/g,"").slice(0,3);clearFeedback()});x.addEventListener("keydown",function(ev){if(ev.key==="Enter")check()});return d}
  function mission(){var l=levels[s.i],isBuild=buildMode(l);e.emoji.textContent=l.animal;e.levelLabel.textContent="Level "+(s.i+1);e.title.textContent=l.title;e.text.textContent=l.text;e.answers.innerHTML="";clearFeedback();e.clear.classList.toggle("show",isBuild);e.check.textContent=isBuild?"Check My Design":"Check My Answer";e.buildHelp.textContent=isBuild?"Click one corner of your rectangle.":"";
    if(l.mode==="answer-area"){e.target.innerHTML="<div>"+l.prompt+'</div><div class="target-row"><span>Rectangle</span><strong>'+l.w+" m × "+l.h+" m</strong></div>";e.answers.appendChild(input("areaInput","Area","m²"))}
    else if(l.mode==="answer-perimeter"){e.target.innerHTML="<div>"+l.prompt+'</div><div class="target-row"><span>Rectangle</span><strong>'+l.w+" m × "+l.h+" m</strong></div>";e.answers.appendChild(input("perInput","Perimeter","m"))}
    else if(l.mode==="answer-both"){e.target.innerHTML="<div>"+l.prompt+'</div><div class="target-row"><span>Rectangle</span><strong>'+l.w+" m × "+l.h+" m</strong></div>";e.answers.appendChild(input("areaInput","Area","m²"));e.answers.appendChild(input("perInput","Perimeter","m"))}
    else if(l.mode==="build-area")e.target.innerHTML='<div class="target-row"><span>Target area</span><strong>'+l.targetA+" m²</strong></div>";
    else if(l.mode==="build-both")e.target.innerHTML='<div class="target-row"><span>Target area</span><strong>'+l.targetA+' m²</strong></div><div class="target-row"><span>Target perimeter</span><strong>'+l.targetP+" m</strong></div>";
    else e.target.innerHTML='<div class="target-row"><span>Keep this area</span><strong>'+l.targetA+' m²</strong></div><div class="target-row"><span>Use less than</span><strong>'+l.refP+" m fence</strong></div>";
    setTimeout(function(){var f=e.answers.querySelector("input");if(f)f.focus()},0)}
  function num(id){var x=$(id);return(!x||x.value.trim()==="")?null:Number(x.value)}
  function validAnswer(l){var a=area(l.w,l.h),p=per(l.w,l.h),av,pv;if(l.mode==="answer-area"){av=num("areaInput");if(av===null)return{ok:false,msg:"Enter the area first."};return av===a?{ok:true}:{ok:false,msg:"Not quite. Count the square units inside the habitat."}}if(l.mode==="answer-perimeter"){pv=num("perInput");if(pv===null)return{ok:false,msg:"Enter the perimeter first."};return pv===p?{ok:true}:{ok:false,msg:"Not quite. Add the lengths around all four sides."}}av=num("areaInput");pv=num("perInput");if(av===null||pv===null)return{ok:false,msg:"Enter both the area and the perimeter."};if(av===a&&pv!==p)return{ok:false,msg:"Your area is correct. Check the fence length again."};if(av!==a&&pv===p)return{ok:false,msg:"Your perimeter is correct. Check the space inside the enclosure."};return av===a&&pv===p?{ok:true}:{ok:false,msg:"Check both measurements and try again."}}
  function validBuild(l){if(!s.rect)return{ok:false,msg:"Build a rectangle first by clicking two opposite corners."};var a=area(s.rect.w,s.rect.h),p=per(s.rect.w,s.rect.h);if(l.mode==="build-area")return a===l.targetA?{ok:true}:{ok:false,msg:"Your design has an area of "+a+" m². The giraffe needs "+l.targetA+" m²."};if(l.mode==="build-both"){if(a===l.targetA&&p!==l.targetP)return{ok:false,msg:"The area is right, but check the fence length."};if(a!==l.targetA&&p===l.targetP)return{ok:false,msg:"The perimeter is right, but the elephant needs "+l.targetA+" m² of space."};return a===l.targetA&&p===l.targetP?{ok:true}:{ok:false,msg:"Your design is "+a+" m² with "+p+" m of fence. Check both targets."}}if(a===l.targetA&&p<l.refP)return{ok:true};if(a===l.targetA)return{ok:false,msg:"The area is right, but this design uses "+p+" m of fence. Try to use less than "+l.refP+" m."};return{ok:false,msg:"This design is "+a+" m² and uses "+p+" m of fence. Keep the area at "+l.targetA+" m² and use less fence."}}
  function check(){if(s.locked)return;var l=levels[s.i],r=buildMode(l)?validBuild(l):validAnswer(l);if(!r.ok){feedback(r.msg,"error");return}s.locked=true;s.done[s.i]=true;feedback(l.success,"success");progress();renderGrid();e.check.disabled=true;e.clear.disabled=true;setTimeout(function(){if(s.i===levels.length-1){showFinish()}else{s.i++;s.first=null;s.rect=null;s.locked=false;e.check.disabled=false;e.clear.disabled=false;render()}},950)}
  function clearBuild(){if(s.locked)return;s.first=null;s.rect=null;clearFeedback();e.buildHelp.textContent="Click one corner of your rectangle.";renderGrid()}function render(){progress();mission();renderGrid()}function showFinish(){e.game.style.display="none";e.finish.classList.add("show")}function reset(){s={i:0,done:{},first:null,rect:null,locked:false};e.game.style.display="block";e.finish.classList.remove("show");e.check.disabled=false;e.clear.disabled=false;render()}
  e.check.addEventListener("click",check);e.clear.addEventListener("click",clearBuild);e.again.addEventListener("click",reset);render();
})();
</script>
</body>
</html>
